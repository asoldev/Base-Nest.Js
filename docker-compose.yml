    mongo:
        image: mongo:latest
        container_name: mongo
        restart: always
        ports:
            - "27018:27017"
        environment:
            MONGO_INITDB_ROOT_USERNAME: admin
            MONGO_INITDB_ROOT_PASSWORD: adminpassword
        volumes:
            - mongo-data:/data/db
        networks:
            - app-network

    redis:
        image: redis:latest
        container_name: redis
        restart: always
        ports:
            - "6380:6379"
        volumes:
            - redis-data:/bitnami/redis/data
        networks:
            - app-network

    minio:
        image: quay.io/minio/minio
        container_name: minio
        restart: always
        ports:
            - "9000:9000"
            - "9001:9001"
        volumes:
            - minio-data:/mnt/data
        environment:
            MINIO_ROOT_USER: yourusername
            MINIO_ROOT_PASSWORD: yourpassword
        command: server /mnt/data --console-address ":9001"
        networks:
            - app-network

    # nginx-proxy-manager:
