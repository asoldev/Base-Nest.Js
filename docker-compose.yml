version: "3.8"

services:
    backend:
        container_name: backend-api
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "${PORT}:${PORT}"
        env_file:
            - .env
        depends_on:
            - mongo

    mongo:
        image: mongo:latest
        container_name: mongo
        restart: always
        ports:
            - "27018:27017"
        volumes:
            - mongo-data:/data/db

volumes:
    mongo-data:
